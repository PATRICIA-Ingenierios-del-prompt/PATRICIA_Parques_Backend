spring.application.name=parques-service
server.port=8085

# --- AMQP (eventos de dominio: parche.created / parche.parques.ready) ---
# Amazon MQ expone una URI amqps://...:5671 completa (TLS), no host+port
# separados -- por eso spring.rabbitmq.addresses, mismo patron que
# Location/Communication/Board. En local, docker-compose sigue funcionando con
# el default amqp://guest:guest@localhost:5672.
spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:amqp://guest:guest@localhost:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# --- Persistencia de partidas ---
# "mongo" en el cluster (estado compartido entre pods), "memory" en local/tests.
# La DB del URI de Atlas se llama "Parques" (P mayúscula, case-sensitive).
parques.persistence=${PARQUES_PERSISTENCE:memory}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/Parques}

# --- Actuator (probes de K8s) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState

# --- Socket backplane (Redis Cluster #2, compartido por los MS de sockets) ---
# Apagado por defecto: un pod unico no lo necesita. En multi-pod,
# BACKPLANE_ENABLED=true y BACKPLANE_REDIS_* apuntando al cluster de pub/sub.
backplane.enabled=${BACKPLANE_ENABLED:false}
backplane.channel=${BACKPLANE_CHANNEL:patricia:backplane:parques}
backplane.redis.host=${BACKPLANE_REDIS_HOST:localhost}
backplane.redis.port=${BACKPLANE_REDIS_PORT:6379}
backplane.redis.password=${BACKPLANE_REDIS_PASSWORD:}
